<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Inspo Saver</title>
<style>
  :root { --bg:#0e0e0e; --card:#1a1a1a; --line:#2a2a2a; --fg:#f2f2f2; --mute:#8a8a8a; --acc:#f2f2f2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif;
         padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 4px 10px; }
  h1 { font-size:22px; margin:0; letter-spacing:-.02em; }
  #count { color:var(--mute); font-size:14px; }
  form { display:flex; gap:8px; margin:0 0 14px; }
  input[type=text] { flex:1; min-width:0; background:var(--card); border:1px solid var(--line); color:var(--fg);
         border-radius:12px; padding:12px 14px; font-size:15px; }
  button { font:inherit; cursor:pointer; }
  .add { background:var(--acc); color:#000; border:0; border-radius:12px; padding:0 16px; font-weight:600; }
  #grid { columns:2; column-gap:10px; }
  .card { break-inside:avoid; margin:0 0 10px; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  .media, .ph { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; background:#222; }
  .ph { display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:14px;
        background:repeating-linear-gradient(45deg,#1d1d1d,#1d1d1d 10px,#222 10px,#222 20px); }
  .bar { padding:6px 8px 8px 10px; font-size:12px; color:var(--mute); }
  .bar .tag { text-transform:uppercase; letter-spacing:.06em; }
  .actions { display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; }
  .bar button { background:none; border:0; color:var(--fg); padding:8px 6px; border-radius:8px; font-size:13px; }
  .bar button.del { color:#ff6b6b; }
  #empty { text-align:center; color:var(--mute); padding:60px 20px; }
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%,20px);
           background:var(--fg); color:#000; padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600;
           opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<header><h1>Inspo</h1><span id="count"></span></header>

<form id="addForm">
  <input type="text" id="linkInput" placeholder="Paste Instagram link" autocomplete="off" inputmode="url">
  <button class="add" type="submit">Save</button>
</form>

<div id="grid"></div>
<div id="empty" hidden>Nothing saved yet.<br>In Instagram, tap Share on a post or reel and choose <b>Inspo</b>.<br>Share a screenshot or screen recording with it to keep the media as a file.</div>
<input type="file" id="mediaPicker" accept="image/*,video/*" hidden>
<div id="toast"></div>

<script src="db.js"></script>
<script>
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const toastEl = document.getElementById('toast');
const picker = document.getElementById('mediaPicker');
let target = null;
let urls = [];

const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg) {
  if (!msg) return;
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function fileName(it) {
  return `inspo-${it.kind.toLowerCase()}-${it.id}.${extFor(it.mime)}`;
}

// Saves the item's media to the phone's Downloads (Gallery shows it from there)
function downloadItem(it) {
  if (!it.media) return;
  const u = URL.createObjectURL(it.media);
  const a = document.createElement('a');
  a.href = u; a.download = fileName(it);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 15000);
}

async function autoDownload() {
  const pending = (await dbAll()).filter(i => i.media && !i.downloaded).sort((a, b) => a.created - b.created);
  for (const it of pending) {
    downloadItem(it);
    it.downloaded = true; await dbPut(it);
    await sleep(1200);
  }
  return pending.length;
}

async function render() {
  urls.forEach(URL.revokeObjectURL); urls = [];
  const items = (await dbAll()).sort((a, b) => b.created - a.created);
  grid.innerHTML = '';
  empty.hidden = items.length > 0;
  document.getElementById('count').textContent = items.length ? items.length + ' saved' : '';

  for (const it of items) {
    const card = document.createElement('div'); card.className = 'card';
    const isVideo = it.mime && it.mime.startsWith('video/');

    if (it.media && isVideo) {
      const v = document.createElement('video');
      v.className = 'media'; v.controls = true; v.playsInline = true; v.preload = 'metadata';
      const u = URL.createObjectURL(it.media); urls.push(u); v.src = u;
      card.appendChild(v);
    } else if (it.media) {
      const a = document.createElement('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
      const img = document.createElement('img'); img.className = 'media'; img.alt = '';
      const u = URL.createObjectURL(it.media); urls.push(u); img.src = u;
      a.appendChild(img); card.appendChild(a);
    } else {
      const a = document.createElement('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
      const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = it.kind;
      a.appendChild(ph); card.appendChild(a);
    }

    const bar = document.createElement('div'); bar.className = 'bar';
    bar.innerHTML = `<span class="tag">${it.kind}</span>
      <div class="actions">
        <button data-act="open">Open</button>
        ${it.media ? '<button data-act="save">Save file</button>' : ''}
        <button data-act="media">${it.media ? 'Replace' : 'Add media'}</button>
        <button class="del" data-act="del">Delete</button>
      </div>`;
    bar.addEventListener('click', async e => {
      const act = e.target.dataset.act;
      if (!act) return;
      if (act === 'open') window.open(it.url, '_blank', 'noopener');
      if (act === 'save') downloadItem(it);
      if (act === 'media') { target = it; picker.click(); }
      if (act === 'del' && confirm('Delete this saved post and its file?')) { await dbDel(it.id); render(); }
    });
    card.appendChild(bar);
    grid.appendChild(card);
  }
}

picker.addEventListener('change', async () => {
  const f = picker.files[0];
  if (f && target) {
    const media = await normalizeMedia(f);
    Object.assign(target, { media, mime: media.type, downloaded: true });
    await dbPut(target);
    downloadItem(target);
    toast('Saved to Downloads');
    render();
  }
  picker.value = ''; target = null;
});

document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('linkInput');
  const r = await saveLink(input.value);
  if (r && r.status === 'saved') toast('Saved'); else if (r && r.status === 'dup') toast('Already saved'); else toast('No Instagram link found');
  if (r) input.value = '';
  render();
});

(async () => {
  // Feedback after arriving from the share sheet
  const q = location.search.slice(1);
  if (q) history.replaceState(null, '', location.pathname);
  const n = await autoDownload();
  if (q === 'saved') toast(n ? 'Saved to Downloads' : 'Saved');
  else if (q === 'dup') toast('Already saved');
  else if (q === 'nolink') toast('No Instagram link found');
  render();
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
